services:
  chatbot:
    image: ghcr.io/zateckar/archie:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/rag.db
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Gemini fallback model ids
      - TEXT_MODEL=${TEXT_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - RERANK_MODEL=${RERANK_MODEL}
      - CHUNK_MODEL=${CHUNK_MODEL}
      # LiteLLM (primary) gateway — REQUIRED for the primary provider to activate.
      # Without LLM_BASE_URL + LLM_API_KEY the app silently runs on Gemini only.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TEXT_MODEL=${LLM_TEXT_MODEL:-}
      - LLM_EMBEDDING_MODEL=${LLM_EMBEDDING_MODEL:-}
      - LLM_RERANK_MODEL=${LLM_RERANK_MODEL:-}
      # Native gateway reranker is opt-in and OFF by default (mis-orders results).
      - LLM_RERANK_ENABLED=${LLM_RERANK_ENABLED:-false}
      # Only used to init an EMPTY vector index; set to the LiteLLM embedding
      # model's real output dim (Qwen3-VL-Embedding-8B = 4096) to avoid a wrong
      # 768 guess if a search ever runs before the first ingestion.
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-4096}
      # On startup, auto-detect an embedding-dimension mismatch (e.g. after
      # switching embedding models) and re-embed the corpus. Set to false to
      # migrate manually via `npx tsx scripts/reembed.ts` instead.
      - AUTO_REEMBED=${AUTO_REEMBED:-true}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.json()).then(d => process.exit(d.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
